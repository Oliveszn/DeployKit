services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy-config:
